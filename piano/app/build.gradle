plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.pramod.piano'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pramod.piano'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -Wall -Wextra'
                arguments '-DANDROID_STL=c++_shared'
                abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    signingConfigs {
        debug {
            // Firebase Google Sign-In is registered against this repository debug certificate.
            storeFile rootProject.file('../spd30/app/keystore/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            storeType 'PKCS12'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig true
        prefab true
    }
}

dependencies {
    implementation 'com.google.firebase:firebase-auth:22.0.0'
    implementation 'com.google.firebase:firebase-database:20.3.1'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
    implementation 'com.google.oboe:oboe:1.8.1'
    implementation 'net.volcanomobile.fluidsynth-android:fluidsynth-android:2.3.3'
}
