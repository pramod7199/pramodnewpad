name: Build Pramod Octapad SPD-30 APK

on:
  push:
    branches: [main]
    paths:
      - 'spd30/**'
      - '.github/workflows/build-spd30.yml'
  pull_request:
    paths:
      - 'spd30/**'
      - '.github/workflows/build-spd30.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build SPD-30 Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate Gradle wrapper
        working-directory: spd30
        run: |
          gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          chmod +x gradlew

      - name: Build SPD-30 APK
        working-directory: spd30
        run: ./gradlew :app:assembleProDebug --no-daemon --stacktrace --warning-mode all

      - name: Prepare APK artifact
        if: success()
        run: |
          mkdir -p artifacts
          SHA="${GITHUB_SHA:0:7}"
          cp spd30/app/build/outputs/apk/pro/debug/app-pro-debug.apk \
            "artifacts/PramodOctapad-SPD30-v1.0-debug-${SHA}.apk"
          ls -lh artifacts/

      - name: Upload SPD-30 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PramodOctapad-SPD30-Debug-APK
          path: artifacts/PramodOctapad-SPD30-v1.0-debug-*.apk
          retention-days: 30
          if-no-files-found: error
