name: Build Audio Editor APK

on:
  push:
    branches: [main]
    paths:
      - 'audio-editor/**'
      - '.github/workflows/build-audio-editor.yml'
  pull_request:
    paths:
      - 'audio-editor/**'
      - '.github/workflows/build-audio-editor.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Audio Editor APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Install SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build
        working-directory: audio-editor
        run: |
          set -o pipefail
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --console=plain 2>&1 | tee gradle-build.log
          echo "=== APK outputs ==="
          ls -la app/build/outputs/apk/debug/ || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: audio-editor/gradle-build.log
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: audio-editor
          path: audio-editor/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Post build error to commit
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try {
              log = fs.readFileSync('audio-editor/gradle-build.log', 'utf8');
            } catch(e) { log = 'Could not read build log'; }
            const lines = log.split('\n');
            const tail = lines.slice(-400).join('\n');
            const body = '## ❌ Audio Editor Build Failed\n\n**Build log (last 400 lines):**\n\n```\n' + tail + '\n```';
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: body
            });
