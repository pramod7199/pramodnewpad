name: Build Pramod Piano APK

on:
  push:
    branches: [main]
    paths:
      - 'piano/**'
      - '.github/workflows/build-piano.yml'
  pull_request:
    paths:
      - 'piano/**'
      - '.github/workflows/build-piano.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Piano Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +e
          yes | sdkmanager --licenses
          sdkmanager_status=${PIPESTATUS[1]}
          set -e
          exit "$sdkmanager_status"

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Piano APK
        working-directory: piano
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: Prepare APK artifact
        run: |
          mkdir -p artifacts
          SHA="${GITHUB_SHA:0:7}"
          cp piano/app/build/outputs/apk/debug/app-debug.apk \
            "artifacts/PramodPiano-v1.0-debug-${SHA}.apk"
          ls -lh artifacts/

      - name: Upload Piano APK
        uses: actions/upload-artifact@v4
        with:
          name: PramodPiano-Debug-APK
          path: artifacts/PramodPiano-v1.0-debug-*.apk
          retention-days: 30
          if-no-files-found: error
