apply plugin: 'com.android.application'

android {
    namespace 'com.pramod.audioeditor'
    compileSdk 34

    defaultConfig {
        applicationId "com.pramod.audioeditor"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
